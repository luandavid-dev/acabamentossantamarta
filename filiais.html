<style>html,body,input,button,select,textarea{font-family:"DM Sans",system-ui,sans-serif !important;}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
{% extends 'layout.html' %}
{% block content %}
<div class="head"><h3>Gerenciar Filiais</h3><a class="btn" href="{{ url_for('nova_filial') }}">+ Nova Filial</a></div>
{% if filiais %}
<ul class="list">
  {% for f in filiais %}
  <li style="padding:10px;background:#fff;border-radius:8px;margin-bottom:8px">
    <strong>{{ f.nome }}</strong> — {{ f.cidade or '' }} 
    <span style="float:right">
      <a href="{{ url_for('editar_filial', id=f.id) }}" class="btn-sm">Editar</a>
      <form method="POST" action="{{ url_for('excluir_filial', id=f.id) }}" style="display:inline" onsubmit="return confirm('Confirma exclusão desta filial?');">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <button class="btn-sm" style="background:#c62828">Excluir</button>
      </form>
    </span>
  </li>
  {% endfor %}
</ul>
{% else %}
<div class="card">Nenhuma filial cadastrada.</div>
{% endif %}
{% endblock %}
